# Config for: python -m hepsetreg.runs.run_reconstruction --train|--predict --config configs/run_reconstruction.yaml

encoder: transformer  # transformer, lgatr, lgatr_slim

features:
  global: [global_met_met, global_met_phi]
  jet: [jet_pt, jet_eta, jet_phi, jet_e, jet_bTag]
  lepton: [pt, eta, phi, e, charge, is_electron]

# Integer truth roles from targets.jet_labels / el_labels / mu_labels.
assignment:
  top: [[jet, 1]]
  antitop: [[jet, 2]]

# Each flow target has a targets.<name>_valid mask.
flow_targets:
  neutrino: [nu_px, nu_py, nu_pz, antinu_px, antinu_py, antinu_pz]
# loss_weights: {assignment: 1.0, neutrino: 1.0}

train:
  train_path: ttbar-2L_train.parquet
  val_path: ttbar-2L_val.parquet
  batch_size: 1024
  d_model: 128
  nhead: 8
  num_layers: 4
  learning_rate: 1.0e-3
  max_epochs: 50
  accelerator: gpu

predict:
  checkpoint: tb_logs/event_reconstruction/version_0/checkpoints/epoch=49-step=50000.ckpt
  stats: tb_logs/event_reconstruction/version_0/stats.pt
  data_path: ttbar-2L_test.parquet
  batch_size: 4096
  accelerator: gpu
  output: ttbar-2L-reconstruction.parquet
  n_steps: 50
  n_samples: 8
